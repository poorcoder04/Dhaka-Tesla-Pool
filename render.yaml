# Render Blueprint for Dhaka Tesla Pool
#
# Two web services, no database declared here. The database is Neon (or any
# external Postgres) because Render's free Postgres expires after 30 days,
# and this has to still be running when a grader opens the link.
#
# ── Deploy in this order ────────────────────────────────────────────────────
#
#   1. Create the database. Copy its pooled or direct connection string.
#   2. Apply migrations from your own machine (see docs/deployment.md).
#      Render's pre-deploy command is a paid feature, so a free-tier service
#      cannot run migrations itself.
#   3. Create ONLY the backend. Note the URL it gets.
#   4. Create the frontend, and set NEXT_PUBLIC_API_URL to the backend URL.
#   5. Set the backend's FRONTEND_ORIGIN to the frontend's URL, then redeploy
#      the backend.
#
# Steps 3-5 are ordered because of a circular dependency that cannot be
# resolved in one pass:
#
#   - The frontend bakes the backend URL into its client bundle AT BUILD TIME
#     (Next.js substitutes NEXT_PUBLIC_* during `next build`), so the backend
#     must already exist and have a URL.
#   - The backend's CORS allowlist must name the frontend's origin, so the
#     frontend must already exist and have a URL.
#
# Render translates every environment variable into a Docker build argument
# during the image build, which is why NEXT_PUBLIC_API_URL works as a plain
# env var here even though the Dockerfile declares it as an ARG. This is
# documented at https://render.com/docs/docker#environment-variable-translation
#
# Nothing secret is passed as a build argument. Render turns every env var
# into a build arg, and a value referenced in a Dockerfile can end up baked
# into the image; the backend declares no ARG for its secrets, and both
# .dockerignore files exclude .env.

services:
  # ── API ──────────────────────────────────────────────────────────────────
  - type: web
    name: dhaka-tesla-pool-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    branch: master
    region: oregon
    healthCheckPath: /health
    # The backend already handles SIGTERM by closing the Prisma connection
    # pool before exiting (see src/index.ts), so the default 30s is ample.
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      # The Neon connection string. Prompted for in the dashboard, never
      # committed. Expect ?sslmode=require in this value.
      - key: DATABASE_URL
        sync: false
      # 256-bit random value, generated by Render and preserved across
      # blueprint syncs. Anyone who knows this can forge a token for any
      # account, so it must never be the value from .env.example.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # PORT is deliberately NOT set here. Render assigns one and routes
      # traffic to it, and it is usually not 5000. Overriding it points the
      # app away from the port the load balancer is actually using, and the
      # service comes up healthy-looking but returns 502 for every request.
      # The backend reads process.env.PORT with a default of 5000, so it
      # follows whatever Render provides.
      # The backend's own health check is /health.
      # Must exactly match the frontend's public origin once it exists -
      # scheme, host and port, no trailing slash. CORS compares this against
      # the browser's Origin header, so a mismatch means every request from
      # the deployed frontend is rejected.
      - key: FRONTEND_ORIGIN
        sync: false

  # ── Web app ──────────────────────────────────────────────────────────────
  - type: web
    name: dhaka-tesla-pool-web
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    branch: master
    region: oregon
    healthCheckPath: /
    maxShutdownDelaySeconds: 30
    envVars:
      # Read at BUILD time, not runtime. Render passes this to the image
      # build as a build argument, so `next build` freezes the backend URL
      # into the client bundle.
      #
      # Changing this does NOT take effect on a restart - it needs a rebuild.
      # Use "Clear build cache & deploy" if a previous build is cached.
      - key: NEXT_PUBLIC_API_URL
        sync: false
